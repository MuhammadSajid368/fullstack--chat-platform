# Edge reverse proxy — HTTP. For HTTPS, mount TLS certs and use default-ssl.conf.
# Set $host via compose / envsubst if needed.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/includes/security-headers.conf;

    # ---- Health (edge) ----
    location = /nginx-health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ---- REST API ----
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_conn conn_limit 40;

        proxy_pass http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Stricter auth endpoints
    location /api/auth/login {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /api/auth/register {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- Socket.IO (WebSocket + long-polling) ----
    location /socket.io/ {
        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://chat_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---- Backend probes (optional internal; not rate-limited heavily) ----
    location = /health {
        proxy_pass http://chat_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /ready {
        proxy_pass http://chat_backend/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Metrics — do not expose publicly without network policy; scrape via compose network.
    location = /metrics {
        return 404;
    }

    # ---- Static SPA (frontend container) ----
    location / {
        proxy_pass http://chat_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Long-cache hashed assets when requested through the edge
    location ~* ^/assets/.*\.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        proxy_pass http://chat_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/includes/security-headers.conf;
    }
}
