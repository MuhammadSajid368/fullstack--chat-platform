global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers: []

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: chat-backend
    metrics_path: /metrics
    scheme: http
    bearer_token_file: /etc/prometheus/bearer.token
    static_configs:
      - targets:
          - backend:3000
        labels:
          service: chat-backend

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
