# Redis production profile — AOF + RDB, safe defaults for chat presence/queues.
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

daemonize no
supervised no
loglevel notice
logfile ""

# Persistence
dir /data
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 900 1
save 300 10
save 60 10000

# Memory safety (tune per host)
maxmemory 512mb
maxmemory-policy allkeys-lru

# Reconnect / client
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Disable dangerous commands remotely
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
