name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_CHAT_SERVICE_MODE: rest
          VITE_API_BASE_URL: /api

  docker:
    name: Docker build verification
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: chat-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: chat-frontend:ci
          build-args: |
            VITE_CHAT_SERVICE_MODE=rest
            VITE_API_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate compose files
        run: |
          cp .env.staging.example .env.ci
          printf '%s\n' "changeme-metrics-token" > deploy/prometheus/bearer.token
          docker compose -f docker-compose.dev.yml --env-file .env.ci config >/dev/null
          docker compose -f docker-compose.prod.yml --env-file .env.ci config >/dev/null
          # prod requires COOKIE_SECURE secrets that staging example lacks — inject
          {
            cat .env.production.example
            echo "POSTGRES_PASSWORD=ci-password"
            echo "JWT_ACCESS_SECRET=ci-access-secret-min-32-characters!!"
            echo "JWT_REFRESH_SECRET=ci-refresh-secret-min-32-characters!"
            echo "METRICS_TOKEN=changeme-metrics-token"
            echo "CORS_ORIGIN=https://chat.example.com"
            echo "GRAFANA_ADMIN_PASSWORD=ci-grafana-password"
          } > .env.prod.ci
          docker compose -f docker-compose.prod.yml --env-file .env.prod.ci config >/dev/null
